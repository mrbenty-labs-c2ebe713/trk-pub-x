name: imds-identity-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: imds identity reachability
        run: |
          set +e
          echo "=====IMDS_IDENTITY_PROBE====="
          curl -s -m 5 -H "Metadata: true" -o /tmp/i.json -w "  instance status=%{http_code} size=%{size_download}\n" "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
          python3 -c "import json;d=json.load(open('/tmp/i.json'));print('  instance top-level keys:',sorted(d.keys()));print('  compute keys:',sorted(d.get('compute',{}).keys()));print('  identity key present:', 'identity' in d or 'identity' in d.get('compute',{}))"
          echo "--- managed identity endpoints (STATUS + KEY NAMES ONLY) ---"
          curl -s -m 5 -H "Metadata: true" -o /tmp/idi.json -w "  identity_info status=%{http_code} size=%{size_download}\n" "http://169.254.169.254/metadata/identity/info?api-version=2018-02-01"
          curl -s -m 5 -H "Metadata: true" -o /tmp/tok.json -w "  identity_token status=%{http_code} size=%{size_download}\n" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F"
          python3 -c "import json
          for f in ('/tmp/idi.json','/tmp/tok.json'):
              try:
                  d=json.load(open(f)); print('  ',f,'KEYS ONLY:',sorted(d.keys()))
                  if 'access_token' in d: print('   *** ACCESS_TOKEN PRESENT — length only:',len(d['access_token']),'(value NOT captured) ***')
                  if 'error' in d: print('   error code:',d.get('error'))
              except Exception as e: print('  ',f,'not json:',str(e)[:60])"
          echo "--- other host-fabric endpoints (reachability only) ---"
          for u in "http://168.63.129.16:80/" "http://169.254.169.254/metadata/versions"; do
            curl -s -m 4 -H "Metadata: true" -o /dev/null -w "  $u -> %{http_code}\n" "$u"
          done
          echo "=====END====="
