name: oidc-sub-probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: request ID token and decode sub
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oidc-sub-probe" -o /tmp/t.json
          python3 -c "import json,base64;t=json.load(open('/tmp/t.json'))['value'];p=t.split('.')[1];p+='='*((4-len(p)%4)%4);c=json.loads(base64.urlsafe_b64decode(p));print('=====OIDC_PROBE=====');[print(k,'=',repr(c.get(k))) for k in ('sub','aud','repository','job_workflow_ref')];print('ALLKEYS=',sorted(c.keys()));print('=====END=====')"
