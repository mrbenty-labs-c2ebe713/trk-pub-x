name: hc2-oidc-delimiter-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint and decode OIDC token (claims only, raw token never printed)
        run: |
          set -euo pipefail
          RAW=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hc2-delimiter-probe")
          printf '%s' "$RAW" | python3 -c '
import sys, json, base64
tok = json.load(sys.stdin)["value"]
pl = tok.split(".")[1]; pl += "=" * (-len(pl) % 4)
claims = json.loads(base64.urlsafe_b64decode(pl))
s = claims.get("sub") or ""
ANCHOR = "repo:mrbenty-labs-c2ebe713@284490589/trk-pub-x@1310984284"
print("=== SUB CLAIM (verbatim repr) ===")
print(repr(s))
print("=== DELIMITER VERDICT  (value set was  x-y@z:w) ===")
print("  colon escaped (%3A present) :", "%3A" in s, "   <-- POSITIVE CONTROL, must be True")
print("  at    escaped (%40 present) :", "%40" in s)
print("  dash  escaped (%2D present) :", "%2D" in s)
print("  literal x-y@z:w survives    :", "x-y@z:w" in s)
print("  literal @ anywhere after anchor:", "@" in s[len(ANCHOR):] if s.startswith(ANCHOR) else "@" in s)
print("=== IDENTITY ANCHOR ===")
print("  sub startswith anchor :", s.startswith(ANCHOR))
print("  anchor appears at all :", ANCHOR in s)
print("=== ALL CLAIMS (payload only; no signature, no token) ===")
print(json.dumps(claims, indent=1, sort_keys=True))
'
