name: win-widen
on: workflow_dispatch
permissions:
  contents: read
jobs:
  widen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            att: '1'
          - os: windows-latest
            att: '2'
          - os: windows-2022
            att: '1'
          - os: windows-2022
            att: '2'
          - os: windows-2025
            att: '1'
          - os: windows-2025
            att: '2'
    runs-on: ${{ matrix.os }}
    steps:
      - name: widen windows wireserver sample
        shell: bash
        run: |
          echo "=====WIN_WIDEN runner=${{ matrix.os }} attempt=${{ matrix.att }}====="
          curl -s -m 8 -o "$RUNNER_TEMP/v.xml" -w "  ws_versions=%{http_code}/%{size_download}\n" "http://168.63.129.16/?comp=versions"
          curl -s -m 8 -H "x-ms-version: 2012-11-30" -o "$RUNNER_TEMP/g.xml" -w "  ws_goalstate=%{http_code}/%{size_download}\n" "http://168.63.129.16/machine/?comp=goalstate"
          curl -s -m 8 -o /dev/null -w "  ctl_unroutable=%{http_code}\n" "http://169.254.169.253/"
          curl -s -m 10 -o /dev/null -w "  ctl_egress=%{http_code}\n" "https://example.com/"
          curl -s -m 8 -o /dev/null -w "  ctl_garbagepath=%{http_code}\n" "http://168.63.129.16/zzgarbagezz"
          curl -s -m 6 -H "Metadata: true" -o "$RUNNER_TEMP/i.json" -w "  imds=%{http_code}\n" "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
          if [ -s "$RUNNER_TEMP/i.json" ]; then echo "  region: $(grep -o '\"location\":\"[^\"]*\"' "$RUNNER_TEMP/i.json" | head -1)"; fi
          if [ -s "$RUNNER_TEMP/g.xml" ]; then echo "  goalstate_has_Certificates: $(grep -c Certificates "$RUNNER_TEMP/g.xml")"; fi
          echo "=====END_ROW====="
